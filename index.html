<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LiveView — real-time charts</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232962ff'/%3E%3Cpath d='M6 21l6-7 5 4 9-10' fill='none' stroke='%23fff' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <svg viewBox="0 0 32 32" width="22" height="22"><rect width="32" height="32" rx="7" fill="#2962ff" /><path d="M6 21l6-7 5 4 9-10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></svg>
          <span>LiveView</span>
        </div>
        <div class="sep"></div>
        <button id="symbolBtn" class="tb-btn sym-btn" title="Symbol search">
          <svg viewBox="0 0 20 20" width="15" height="15"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.8" /><path d="M13 13l4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" /></svg>
          <span id="symbolName"></span>
        </button>
        <button id="compareBtn" class="tb-btn icon" title="Compare or add symbol">
          <svg viewBox="0 0 20 20" width="16" height="16"><circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-width="1.5" /><path d="M10 6.5v7M6.5 10h7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" /></svg>
        </button>
        <div class="sep"></div>
        <div id="tfs" class="seg"></div>
        <div class="menu" id="tfMenu">
          <button class="tb-btn icon narrow" id="tfBtn" title="More timeframes">
            <svg viewBox="0 0 20 20" width="12" height="12"><path d="M5 8l5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /></svg>
          </button>
          <div class="pop" id="tfPop"></div>
        </div>
        <div class="sep"></div>
        <div class="menu" id="typeMenu">
          <button class="tb-btn" id="typeBtn"></button>
          <div class="pop" id="typePop"></div>
        </div>
        <div class="menu" id="indMenu">
          <button class="tb-btn" id="indBtn">
            <svg viewBox="0 0 20 20" width="15" height="15"><path d="M2 15l4-6 3 3 4-8 5 9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></svg>
            Indicators
          </button>
          <div class="pop" id="indPop"></div>
        </div>
        <div class="menu" id="scaleMenu">
          <button class="tb-btn" id="scaleBtn" title="Price scale"></button>
          <div class="pop" id="scalePop"></div>
        </div>
        <button id="replayBtn" class="tb-btn" title="Bar replay">
          <svg viewBox="0 0 20 20" width="15" height="15"><path d="M9 5.5L3 10l6 4.5zM17 5.5L11 10l6 4.5z" fill="currentColor" /></svg>
          Replay
        </button>
        <div class="spacer"></div>
        <div class="menu" id="layoutMenu">
          <button class="tb-btn icon" id="layoutBtn" title="Chart layout"></button>
          <div class="pop right" id="layoutPop"></div>
        </div>
        <div class="menu" id="tzMenu">
          <button class="tb-btn num" id="tzBtn" title="Timezone"></button>
          <div class="pop right" id="tzPop"></div>
        </div>
        <span id="feed" class="feed" data-status="connecting"><i></i><b>Connecting</b></span>
        <button id="shotBtn" class="tb-btn icon" title="Save chart image">
          <svg viewBox="0 0 20 20" width="16" height="16"><path d="M3 6.5h3l1.2-2h5.6l1.2 2h3v9H3z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" /><circle cx="10" cy="10.8" r="2.8" fill="none" stroke="currentColor" stroke-width="1.5" /></svg>
        </button>
        <button id="themeBtn" class="tb-btn icon" title="Toggle theme">
          <svg viewBox="0 0 20 20" width="16" height="16"><path d="M16 11.5A6.5 6.5 0 018.5 4a6.5 6.5 0 107.5 7.5z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" /></svg>
        </button>
        <button id="sideBtn" class="tb-btn icon" title="Show or hide watchlist">
          <svg viewBox="0 0 20 20" width="16" height="16"><rect x="3" y="4" width="14" height="12" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5" /><path d="M12.5 4v12" stroke="currentColor" stroke-width="1.5" /></svg>
        </button>
        <button id="fsBtn" class="tb-btn icon" title="Fullscreen">
          <svg viewBox="0 0 20 20" width="16" height="16"><path d="M3 7.5V3h4.5M12.5 3H17v4.5M17 12.5V17h-4.5M7.5 17H3v-4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></svg>
        </button>
      </header>

      <aside class="tools" id="tools"></aside>

      <main class="center">
        <div class="chart-wrap" id="charts"></div>
        <section class="bottom" id="bottom">
          <div class="tabs" id="tabs">
            <button data-tab="calendar">Economic calendar</button>
            <button data-tab="news">News</button>
            <button data-tab="movers">Top movers</button>
            <button data-tab="scripts">Script editor</button>
            <div class="spacer"></div>
            <div id="tabControls" class="tab-controls"></div>
            <button id="collapseBtn" class="icon" title="Toggle panel">
              <svg viewBox="0 0 20 20" width="14" height="14"><path d="M5 8l5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /></svg>
            </button>
          </div>
          <div class="tab-body" id="tabBody"></div>
          <div class="script-panel hidden" id="scriptPanel"></div>
        </section>
      </main>

      <aside class="side">
        <div class="side-grip" id="sideGrip" title="Drag to resize, double-click to reset"></div>
        <div class="side-head">
          <span>Watchlist</span>
          <div>
            <button id="addBtn" class="tb-btn icon" title="Add symbol">
              <svg viewBox="0 0 20 20" width="15" height="15"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" /></svg>
            </button>
            <button id="sideHideBtn" class="tb-btn icon" title="Hide watchlist">
              <svg viewBox="0 0 20 20" width="15" height="15"><path d="M8 5l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /></svg>
            </button>
          </div>
        </div>
        <div class="wl-cols"><span>Symbol</span><span>Last</span><span>Chg%</span></div>
        <div id="watchlist" class="watchlist"></div>
        <div id="details" class="details"></div>
      </aside>
    </div>

    <div id="searchModal" class="modal hidden">
      <div class="modal-card">
        <div class="modal-head">
          <svg viewBox="0 0 20 20" width="18" height="18"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.8" /><path d="M13 13l4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" /></svg>
          <input id="searchInput" type="text" placeholder="Search symbol or name" autocomplete="off" spellcheck="false" />
          <button id="searchClose" class="tb-btn icon" title="Close">
            <svg viewBox="0 0 20 20" width="15" height="15"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" /></svg>
          </button>
        </div>
        <div class="chips-row">
          <div class="chips" id="searchChips"></div>
          <button id="importFolderBtn" class="tb-btn" title="Pick a folder of CSV files">Import CSV folder</button>
          <button id="importFilesBtn" class="tb-btn" title="Pick individual CSV files">Files…</button>
          <input id="csvFolder" type="file" webkitdirectory multiple hidden />
          <input id="csvFiles" type="file" accept=".csv,text/csv" multiple hidden />
        </div>
        <div class="results" id="searchResults"></div>
      </div>
    </div>

    <div id="inputsModal" class="modal hidden"><div class="modal-card inputs-card"></div></div>

    <div id="importModal" class="modal hidden">
      <div class="modal-card import-card">
        <h3 id="importTitle">Importing CSV data</h3>
        <div class="progress"><i id="importBar"></i></div>
        <p id="importText" class="muted"></p>
        <button id="importClose" class="tb-btn hidden">Close</button>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
